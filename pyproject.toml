[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dirhandler"
version = "0.0.1"
description = "A tool for making folders"
authors = [
  { name = "maganasampson", email = "megan.sampson@ukaea.uk" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: GNU LGPL",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
  "pyYAML>=6.0.2",
  "click>=8.3.1"
]

[project.scripts]
makedirs = "dirhandler.json_maker:startclick"


[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "furo>=2025.12.19",
    "pytest>=9.1.1",
    "sphinx>=8.1.3",
    "sphinx-design>=0.6.1",
]
